<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jipange Parking - Smart Dashboard</title>
    <!-- Link to our layout stylesheet and browser icon image -->
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top header layout showing application title and real-time empty space indicators -->
    <header>
        <div class="header-container">
            <h1>🅿️ Jipange Parking Automation</h1>
            <div class="counter-wrapper">
                <span style="font-size: 0.9rem; color: #94a3b8;">Available Slots:</span>
                <span id="available-counter">--</span>
            </div>
        </div>
    </header>

    <!-- Main user interface display workspace area -->
    <main>
        
        <!-- Left Sidebar: Form boxes to handle entrance gate and checkout gate operations -->
        <div class="sidebar">
            
            <!-- Entry Input Card Box -->
            <div class="card">
                <h2 class="entry-title">🚗 Entry Barrier Check-In</h2>
                <div class="form-group">
                    <label>License Plate Number</label>
                    <input type="text" id="entry-plate" placeholder="e.g. KAA 123A">
                </div>
                <button onclick="processCheckIn()" class="btn-entry">Trigger Entry Barrier</button>
            </div>

            <!-- Exit Input Card Box -->
            <div class="card">
                <h2 class="exit-title">🚙 Exit Barrier Check-Out</h2>
                <div class="form-group">
                    <label>License Plate Number</label>
                    <input type="text" id="exit-plate" placeholder="e.g. KAA 123A">
                </div>
                <div class="form-group">
                    <label>M-Pesa Mobile Number</label>
                    <input type="text" id="mpesa-phone" placeholder="e.g. 0712345678">
                </div>
                <button onclick="processCheckOut()" class="btn-exit">Verify Fee & Process M-Pesa STK</button>
            </div>

        </div>

        <!-- Right Side Panel: Grid block to map out all parking spot slots cells visually -->
        <div class="grid-container">
            <h2 class="grid-title">📋 Live Parking Space Allocations Map</h2>
            <div id="parking-grid" class="parking-matrix">
                <!-- JavaScript will dynamically insert slot elements here -->
            </div>
        </div>

    </main>

    <!-- Floating popup toast banner box to show status alert updates -->
    <div id="toast">
        <div id="toast-indicator" class="toast-dot"></div>
        <p id="toast-message"></p>
    </div>

    <!-- Frontend Scripting: Connects dashboard operations directly to the running Java server -->
    <script>
        // Points to our local backend API port connection address
        const API_BASE_URL = "http://localhost:8080/api/parking";

        // Fetches slot data from the server and redraws the parking grid dynamically
        async function refreshDashboard() {
            try {
                const response = await fetch(`${API_BASE_URL}/slots`);
                if (!response.ok) throw new Error("Server communication endpoint failure.");
                const slots = await response.json();
                
                const gridContainer = document.getElementById("parking-grid");
                gridContainer.innerHTML = ""; // Clear out previous slot cards before rebuilding
                
                let vacantCounter = 0;

                // Loop through our slot objects array list to build the grid blocks
                slots.forEach(slot => {
                    const block = document.createElement("div");
                    
                    // Style slot cards dynamically based on vacancy states
                    if (slot.status === 'VACANT') {
                        block.className = "slot-card slot-vacant";
                        vacantCounter++;
                    } else {
                        block.className = "slot-card slot-occupied";
                    }
                    
                    block.innerHTML = `
                        <div class="slot-number">${slot.slotNumber}</div>
                        <div class="slot-status">${slot.status}</div>
                    `;
                    
                    gridContainer.appendChild(block);
                });

                // Update the total live vacant spaces counter text label header
                document.getElementById("available-counter").innerText = vacantCounter;
            } catch (error) {
                console.error("Dashboard connection sync error:", error);
                showToast("Cannot synchronize with core execution layer engine server.", "error");
            }
        }

        // Send vehicle check-in registration plate details to the backend api
        async function processCheckIn() {
            const plateInput = document.getElementById("entry-plate");
            const cleanPlate = plateInput.value.trim().toUpperCase();
            if (!cleanPlate) return showToast("Please input a valid vehicle plate.", "error");

            try {
                const res = await fetch(`${API_BASE_URL}/checkin?plate=${encodeURIComponent(cleanPlate)}`, { method: 'POST' });
                const message = await res.text();
                
                if (message.includes("ERROR") || message.includes("REGRET")) {
                    showToast(message, "error");
                } else {
                    showToast(message, "success");
                    plateInput.value = "";
                }
                refreshDashboard();
            } catch (err) {
                showToast("Server connection error during entry log checkout workflow.", "error");
            }
        }

        // Send plate and phone configurations to trigger pricing lookups and simulated M-Pesa push prompts
        async function processCheckOut() {
            const plateInput = document.getElementById("exit-plate");
            const phoneInput = document.getElementById("mpesa-phone");
            
            const cleanPlate = plateInput.value.trim().toUpperCase();
            const cleanPhone = phoneInput.value.trim();

            if (!cleanPlate) return showToast("Please input an active tracking license plate.", "error");
            if (!cleanPhone) return showToast("M-Pesa validation requires an active Safaricom mobile contact row.", "error");

            showToast(`Initiating Daraja STK Push prompt to device: ${cleanPhone}...`, "success");

            try {
                const res = await fetch(`${API_BASE_URL}/checkout?plate=${encodeURIComponent(cleanPlate)}`, { method: 'POST' });
                const message = await res.text();
                
                if (message.includes("ERROR") || message.includes("failed")) {
                    showToast(message, "error");
                } else {
                    showToast(message, "success");
                    plateInput.value = "";
                    phoneInput.value = "";
                }
                refreshDashboard();
            } catch (err) {
                showToast("Server connection failure during payment check logs handling sets execution.", "error");
            }
        }

        // Display status alert message notifications using toast window banners
        function showToast(text, type) {
            const toast = document.getElementById("toast");
            const messageEl = document.getElementById("toast-message");
            const indicatorEl = document.getElementById("toast-indicator");
            
            messageEl.innerText = text;
            
            if (type === 'error') {
                indicatorEl.className = 'toast-dot dot-error';
            } else {
                indicatorEl.className = 'toast-dot dot-success';
            }
            
            // Toggle the visibility styling property definitions matching our stylesheet
            toast.className = "show";
            
            setTimeout(() => {
                toast.className = "";
            }, 6500);
        }

        // Auto-refresh the parking grid elements layout whenever the page loads up fresh
        window.onload = refreshDashboard;
    </script>
</body>
</html>
